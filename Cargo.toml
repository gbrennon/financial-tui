[package]
name = "financial-tui"
version = "0.1.0"
edition = "2021"

[dependencies]
uuid = { version = "1.0", features = ["v7"] }
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
ratatui = "0.24"
crossterm = "0.27"
tokio = { version = "1.0", features = ["full"] }

[dev-dependencies]
mockall = "0.11"
tempfile = "3.8"