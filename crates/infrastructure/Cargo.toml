[package]
name = "financial_infrastructure"
version.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
financial_domain = { path = "../domain" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.0", features = ["full"] }

[dev-dependencies]
tempfile = "3.8"
tokio = { version = "1.0", features = ["full"] }